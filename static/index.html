<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 查看器</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23dc2626'/><text x='16' y='22' font-size='13' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>PDF</text></svg>">
</head>
<body>

<!-- ======================== 工具栏 ======================== -->
<div class="toolbar">
  <div class="tb-group">
    <button class="btn" id="btnSidebar" title="收起/展开侧边栏 (S)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
    <button class="btn" id="btnHome" title="返回文件列表 (H)">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    </button>
  </div>

  <div class="tb-sep"></div>

  <!-- 翻页 -->
  <div class="tb-group" id="navGroup" hidden>
    <button class="btn" id="btnFirst" title="第一页 (Home)">
      <svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="5" y2="19"/><path d="M19 5l-9 7 9 7z"/></svg>
    </button>
    <button class="btn" id="btnPrev" title="上一页 (PageUp)">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <input type="number" class="page-input" id="pageInput" min="1" value="1" title="跳转到页码">
    <span class="page-total" id="pageTotal">/ 0</span>
    <button class="btn" id="btnNext" title="下一页 (PageDown)">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="btn" id="btnLast" title="最后一页 (End)">
      <svg viewBox="0 0 24 24"><line x1="19" y1="5" x2="19" y2="19"/><path d="M5 5l9 7-9 7z"/></svg>
    </button>
  </div>

  <div class="tb-sep" id="navSep" hidden></div>

  <!-- 缩放 -->
  <div class="tb-group" id="zoomGroup" hidden>
    <button class="btn" id="btnZoomOut" title="缩小 (Ctrl -)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <select class="zoom-select" id="zoomSelect" title="缩放比例">
      <option value="auto">自动</option>
      <option value="page">适应页面</option>
      <option value="width">适应宽度</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="3">300%</option>
      <option value="4">400%</option>
    </select>
    <button class="btn" id="btnZoomIn" title="放大 (Ctrl +)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
    </button>
  </div>

  <div class="tb-sep" id="zoomSep" hidden></div>

  <!-- 旋转 / 其他 -->
  <div class="tb-group" id="toolGroup" hidden>
    <button class="btn" id="btnRotate" title="顺时针旋转 (R)">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
    <button class="btn" id="btnDark" title="反转颜色 (D)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="btnFitWidth" title="适应宽度 (W)">
      <svg viewBox="0 0 24 24"><polyline points="4 8 4 16"/><polyline points="20 8 20 16"/><path d="M8 12h8"/><polyline points="10 10 8 12 10 14"/><polyline points="14 10 16 12 14 14"/></svg>
    </button>
  </div>

  <div class="tb-sep" id="toolGroupSep" hidden></div>

  <!-- 标注工具 -->
  <div class="tb-group" id="annotGroup" hidden>
    <button class="btn" id="btnAnnotMode" title="标注模式 (A) — 开启后可直接框选区域">
      <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 15.5z"/><path d="M14 7l3 3"/></svg>
      <span class="lbl">标注</span>
    </button>
    <div class="color-picker" id="colorPicker">
      <button class="color-dot on" data-color="yellow" title="黄色高亮" style="--c:#fbbf24"></button>
      <button class="color-dot" data-color="green" title="绿色高亮" style="--c:#4ade80"></button>
      <button class="color-dot" data-color="blue" title="蓝色高亮" style="--c:#60a5fa"></button>
      <button class="color-dot" data-color="pink" title="粉色高亮" style="--c:#f472b6"></button>
      <button class="color-dot" data-color="red" title="红色高亮" style="--c:#f87171"></button>
    </div>
  </div>

  <div class="tb-sep" id="annotSep" hidden></div>

  <!-- 编辑工具 -->
  <div class="tb-group" id="editGroup" hidden>
    <button class="btn" id="btnEditMode" title="进入编辑模式 (E)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="13" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="10" y2="17"/></svg>
      <span class="lbl">编辑</span>
    </button>
  </div>

  <div class="tb-sep" id="editSep" hidden></div>

  <!-- 视图模式 -->
  <div class="tb-group" id="viewGroup" hidden>
    <button class="btn" id="btnViewSingle" title="单页视图" class="on">
      <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/></svg>
    </button>
    <button class="btn" id="btnViewDouble" title="双栏对照 (2)">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="9" height="16" rx="2"/><rect x="13" y="4" width="9" height="16" rx="2"/></svg>
    </button>
    <button class="btn" id="btnScrollPlay" title="自动滚动 (空格暂停)">
      <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="btnBookmark" title="本页加书签 (B)">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    </button>
  </div>

  <div class="tb-spacer"></div>

  <!-- 搜索 -->
  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索文档…" autocomplete="off">
    <button class="search-clear" id="searchClear" title="清除">&times;</button>
  </div>
  <span class="search-count" id="searchCount"></span>
  <div class="tb-group" id="searchNav" hidden>
    <button class="btn" id="btnPrevHit" title="上一个匹配 (Shift+Enter)">
      <svg viewBox="0 0 24 24"><path d="M15 8l-7 7 7 7" transform="translate(0,-3)"/></svg>
    </button>
    <button class="btn" id="btnNextHit" title="下一个匹配 (Enter)">
      <svg viewBox="0 0 24 24"><path d="M9 8l7 7-7 7" transform="translate(0,-3)"/></svg>
    </button>
  </div>

  <div class="tb-sep" id="searchSep" hidden></div>

  <div class="tb-group" id="fileGroup" hidden>
    <button class="btn" id="btnPrint" title="打印">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/></svg>
    </button>
  </div>
</div>

<!-- ======================== 主体 ======================== -->
<div class="main">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-tabs">
      <button class="side-tab on" data-tab="thumbs">缩略图</button>
      <button class="side-tab" data-tab="outline">目录</button>
      <button class="side-tab" data-tab="annots">标注</button>
    </div>
    <div class="side-body">
      <div class="side-panel on" id="panelThumbs">
        <div id="thumbList"></div>
      </div>
      <div class="side-panel" id="panelOutline">
        <div id="outlineList"></div>
      </div>
      <div class="side-panel" id="panelAnnots">
        <div class="annot-filter" id="annotFilter">
          <button class="af-chip on" data-filter="all">全部</button>
          <button class="af-chip" data-filter="highlight">高亮</button>
          <button class="af-chip" data-filter="underline">下划线</button>
          <button class="af-chip" data-filter="note">笔记</button>
          <span class="af-count" id="annotCount"></span>
        </div>
        <div id="annotList"></div>
        <div class="annot-actions" id="annotActions" hidden>
          <button class="mini-btn" id="btnExportMd" title="导出为 Markdown 笔记">导出笔记</button>
          <button class="mini-btn" id="btnExportJson" title="导出原始标注数据">导出 JSON</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 阅读区 -->
  <div class="viewer" id="viewer" tabindex="0">
    <div class="progress-bar" id="progressBar" hidden>
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-markers" id="progressMarkers"></div>
    </div>
    <div class="pages empty" id="pages">
      <!-- 欢迎页 / 页面容器 -->
    </div>
    <div class="loading hide" id="loading">
      <div class="spinner"></div>
      <div id="loadingText">正在加载…</div>
    </div>
    <div class="toast" id="toast"></div>

    <!-- 编辑工具面板 -->
    <div class="edit-palette" id="editPalette" hidden>
      <div class="ep-row">
        <span class="ep-label">工具</span>
        <button class="ep-tool" data-tool="select" title="选择 / 删除对象">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 1.5L10 19z"/></svg>
          <em>选择</em>
        </button>
        <button class="ep-tool" data-tool="whiteout" title="涂白 — 盖住不需要的内容">
          <svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="1" fill="currentColor" stroke="none"/></svg>
          <em>涂白</em>
        </button>
        <button class="ep-tool" data-tool="text" title="文字 — 拖出文本框后输入">
          <svg viewBox="0 0 24 24"><path d="M6 5h12"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
          <em>文字</em>
        </button>
        <button class="ep-tool" data-tool="rect" title="矩形框">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
          <em>矩形</em>
        </button>
        <button class="ep-tool" data-tool="ellipse" title="椭圆">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
          <em>椭圆</em>
        </button>
        <button class="ep-tool" data-tool="line" title="直线">
          <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
          <em>直线</em>
        </button>
        <button class="ep-tool danger" data-tool="redact"
          title="涂黑 — 永久销毁该区域的文字（不可逆！）">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="7" width="16" height="10" rx="1"
              fill="currentColor" stroke="none"/>
          </svg>
          <em>涂黑</em>
        </button>
      </div>

      <div class="ep-row">
        <span class="ep-label">颜色</span>
        <label class="ep-colorwrap">
          <input type="color" id="editColor" value="#111111">
          <span class="ep-colorval" id="editColorValue">#111111</span>
        </label>
        <span class="ep-gap"></span>
        <button class="ep-btn" id="btnEditUndo" title="撤销上一个对象">撤销</button>
        <button class="ep-btn" id="btnEditClear" title="清空全部编辑对象">清空</button>
        <button class="ep-btn primary" id="btnExportPdf" title="导出为新的 PDF 文件">导出 PDF</button>
        <span class="edit-hint" id="editSaveHint"></span>
      </div>

      <div class="ep-row ep-redact-row">
        <span class="ep-label danger">涂黑</span>
        <span class="ep-warn">
          涂黑会<strong>永久删除</strong>区域内文字，不可撤销
        </span>
        <span class="ep-gap"></span>
        <span class="ep-redact-count" id="redactCount">0 处</span>
        <button class="ep-btn danger" id="btnRedactPdf"
          title="执行涂黑并另存为新文件">涂黑并另存为…</button>
      </div>
    </div>

    <!-- 页面管理面板 -->
    <div class="page-panel" id="pagePanel" hidden>
      <div class="pp-head">页面管理</div>
      <div class="pp-body" id="pageListBody"></div>
    </div>

    <!-- 文字输入浮层 -->
    <div class="text-input-pop" id="textPop" hidden>
      <textarea class="tip-textarea" id="tipText" rows="3"
        placeholder="输入要添加的文字…（可多行）"></textarea>
      <div class="tip-foot">
        <span class="tip-size">字号
          <input type="number" id="tipSize" min="6" max="120" value="14">
        </span>
        <span class="ep-gap"></span>
        <button class="tip-btn" id="tipCancel">取消</button>
        <button class="tip-btn primary" id="tipOk">确定</button>
      </div>
    </div>

    <!-- 编辑对象操作条（选中对象时出现在其附近） -->
    <div class="obj-bar" id="objBar" hidden>
      <span class="ob-name" id="objBarName">对象</span>
      <button class="ob-btn" id="objBarFront" title="置顶">置顶</button>
      <button class="ob-btn" id="objBarBack" title="置底">置底</button>
      <button class="ob-btn danger" id="objBarDel" title="删除该对象">删除</button>
    </div>

    <!-- 涂黑二次确认（不可逆操作，必须显式确认） -->
    <div class="confirm-mask" id="redactConfirm" hidden>
      <div class="confirm-box">
        <div class="cb-head danger">
          <svg viewBox="0 0 24 24">
            <path d="M12 3l9 16H3z"/>
            <line x1="12" y1="10" x2="12" y2="14"/>
            <circle cx="12" cy="16.6" r="0.9" fill="currentColor"/>
          </svg>
          确认执行涂黑？
        </div>
        <div class="cb-body">
          <p>即将<strong>永久删除</strong>以下区域内的文字内容：</p>
          <ul class="cb-stats" id="redactConfirmStats"></ul>
          <p class="cb-note">
            此操作<strong>不可撤销</strong>，被删除的文字会从文件里
            彻底移除，无法通过复制、文本提取或字符串搜索找回。
          </p>
          <p class="cb-note">
            结果将<strong>另存为新文件</strong>，你的原文件不会被修改。
          </p>
        </div>
        <div class="cb-foot">
          <button class="ep-btn" id="redactCancel">取消</button>
          <button class="ep-btn danger" id="redactOk">确认涂黑</button>
        </div>
      </div>
    </div>

    <!-- 划词浮动菜单 -->
    <div class="sel-menu" id="selMenu" hidden>
      <button class="sm-btn" data-act="highlight" data-color="#fbbf24" title="高亮（黄）">
        <span class="sm-swatch" style="background:#fbbf24"></span>高亮
      </button>
      <button class="sm-btn" data-act="underline" data-color="#ef4444" title="下划线（红）">
        <span class="sm-swatch sm-underline" style="background:#ef4444"></span>下划线
      </button>
      <button class="sm-btn" data-act="wavy" data-color="#3b82f6" title="波浪线（蓝）">
        <span class="sm-swatch sm-wavy" style="background:#3b82f6"></span>波浪线
      </button>
      <button class="sm-btn" data-act="strike" data-color="#71717a" title="删除线">
        <span class="sm-swatch sm-strike" style="background:#71717a"></span>删除线
      </button>
      <span class="sm-sep"></span>
      <button class="sm-btn" data-act="note" title="添加笔记">
        <span class="sm-swatch sm-note"></span>笔记
      </button>
      <button class="sm-btn" data-act="copy" title="复制文本">
        <span class="sm-swatch sm-copy"></span>复制
      </button>
    </div>

    <!-- 标注气泡（编辑笔记） -->
    <div class="annot-pop" id="annotPop" hidden>
      <div class="ap-head">
        <span class="ap-tag" id="apTag">高亮</span>
        <span class="ap-text" id="apText"></span>
      </div>
      <textarea class="ap-note" id="apNote" placeholder="写下你的批注…" rows="3"></textarea>
      <div class="ap-foot">
        <button class="ap-btn danger" id="apDelete">删除</button>
        <span class="ap-flex"></span>
        <button class="ap-btn" id="apCancel">取消</button>
        <button class="ap-btn primary" id="apSave">保存</button>
      </div>
    </div>
  </div>

</div>

<input type="file" id="filePicker" accept="application/pdf,.pdf" hidden multiple>

<script type="module" src="/static/app.js"></script>
</body>
</html>
